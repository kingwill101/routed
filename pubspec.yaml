name: routed_ecosystem
publish_to: none
workspace:
  - packages/routed_core
  - packages/routed_cli
  - packages/routed_analyzer
  - packages/server_contracts
  - packages/server_auth
  - packages/server_cache
  - packages/server_sessions
  - packages/server_storage
  - packages/server_rate_limit
  - packages/routed
  - packages/routed_cache
  - packages/routed_sessions
  - packages/routed_storage
  - packages/routed_rate_limit
  - packages/routed_io
  - packages/routed_node
  - packages/routed_node/example/api
  - packages/server_native
  - packages/routed_auth
  - packages/routed_auth_cloudflare
  - packages/routed_auth_sqlite
  - packages/routed_hotwire
  - packages/routed_views
  - packages/routed_openapi
  - packages/routed_openapi_builder
  - packages/routed_observability
  - packages/routed_logging
  - packages/routed_security
  - packages/routed_http
  - packages/routed_validation
  - packages/server_testing/routed_testing
  - examples/fallback
  - examples/forward_proxy
  - examples/http2
  - examples/liquid_template
  - examples/multipart
  - examples/project_commands_demo
  - examples/route_events
  - examples/localization
  - examples/auth_demo
  - examples/cloudflare_auth
  - examples/static_mounts
  - examples/oauth_keycloak
  - examples/kitchen_sink
  - examples/config_demo
  - examples/policy_demo/policy_demo
  - examples/error_responses
  - examples/websocket
  - examples/rate_limiting
  - examples/openapi_demo
  - examples/full_stack

funding:
  - https://www.buymeacoffee.com/kingwill101

environment:
  sdk: ">=3.12.0 <4.0.0"
dependencies:
  contextual: ^2.2.0
  liquify: ^1.4.2
  uuid: ^4.5.2

dependency_overrides:
  # native_prebuilt 0.4.0 has not widened its code_assets constraint yet;
  # keep the workspace on the current code-assets protocol while its manifest
  # recipe and prebuilt resolver remain source-compatible with it.
  code_assets: ^2.0.0
  # server_testing 0.4.x uses artisanal ^0.5.0. Keep the workspace on one
  # version while older routed CLI/testing packages are migrated.
  artisanal: ^0.5.0
  # Keep the workspace lockfile on the latest upstream test harness. Published
  # packages retain their own compatible ranges above.
  server_testing: ^0.4.0

dev_dependencies:
  coverage: ^1.15.1
  lints: ^6.0.0
  test: ^1.29.0
  yaml: ^3.1.3

  routed: any
  file: any
  path: any
  http: any
  routed_http: any
  server_cache: any
  routed_storage: any
  routed_sessions: any
  routed_auth: any
  server_auth: any
  server_sessions: any
  routed_views: any
tags:
  - workspace
