schema: 2
package: server_native
asset_name: src/ffi.g.dart
library_stem: server_native
release:
  provider: github
  repository: kingwill101/routed
  tag: server-native-prebuilt-v0.1.7
build:
  recipes:
    - target:
        os: linux
      steps:
        - id: cargo-build
          type: command
          working_directory: native
          commands:
            - [cargo, build, --release, --locked, --target, "{{ target.rust_target }}", --target-dir, "{{ output }}/cargo-target"]
        - id: export
          type: export_artifact
          artifact: server_native
          kind: dynamic_library
          primary: "{{ output }}/cargo-target/{{ target.rust_target }}/release/{{ library.dynamic_name }}"
    - target:
        os: macos
      steps:
        - id: cargo-build
          type: command
          working_directory: native
          commands:
            - [cargo, build, --release, --locked, --target, "{{ target.rust_target }}", --target-dir, "{{ output }}/cargo-target"]
        - id: export
          type: export_artifact
          artifact: server_native
          kind: dynamic_library
          primary: "{{ output }}/cargo-target/{{ target.rust_target }}/release/{{ library.dynamic_name }}"
    - target:
        os: windows
      steps:
        - id: cargo-build
          type: command
          working_directory: native
          commands:
            - [cargo, build, --release, --locked, --target, "{{ target.rust_target }}", --target-dir, "{{ output }}/cargo-target"]
        - id: export
          type: export_artifact
          artifact: server_native
          kind: dynamic_library
          primary: "{{ output }}/cargo-target/{{ target.rust_target }}/release/{{ library.dynamic_name }}"
    - target:
        os: android
      steps:
        - id: cargo-build
          type: command
          working_directory: native
          commands:
            - [cargo, build, --release, --locked, --target, "{{ target.rust_target }}", --target-dir, "{{ output }}/cargo-target"]
        - id: export
          type: export_artifact
          artifact: server_native
          kind: dynamic_library
          primary: "{{ output }}/cargo-target/{{ target.rust_target }}/release/{{ library.dynamic_name }}"
    - target:
        os: ios
        sdk: iphoneos
      steps:
        - id: cargo-build
          type: command
          working_directory: native
          commands:
            - [cargo, build, --release, --locked, --target, "{{ target.rust_target }}", --target-dir, "{{ output }}/cargo-target"]
        - id: export
          type: export_artifact
          artifact: server_native
          kind: static_library
          primary: "{{ output }}/cargo-target/{{ target.rust_target }}/release/{{ library.static_name }}"
    - target:
        os: ios
        sdk: iphonesimulator
      steps:
        - id: cargo-build
          type: command
          working_directory: native
          commands:
            - [cargo, build, --release, --locked, --target, "{{ target.rust_target }}", --target-dir, "{{ output }}/cargo-target"]
        - id: export
          type: export_artifact
          artifact: server_native
          kind: static_library
          primary: "{{ output }}/cargo-target/{{ target.rust_target }}/release/{{ library.static_name }}"
artifacts:
  linux-x64:
    archive: server_native-linux-x64.tar.gz
    payload:
      type: dynamic_library
  linux-arm64:
