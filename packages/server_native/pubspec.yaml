name: server_native
description: Rust-backed transport boot APIs for Dart HTTP servers.
version: 0.1.3+1
homepage: https://github.com/kingwill101/routed/tree/master/packages/server_native
repository: https://github.com/kingwill101/routed
issue_tracker: https://github.com/kingwill101/routed/issues
documentation: https://github.com/kingwill101/routed/tree/master/packages/server_native#readme
tags:
  - server
  - ffi
  - rust

funding:
  - https://www.buymeacoffee.com/kingwill101

resolution: workspace

executables:
  setup:

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  # Supports the current code-assets protocol and the 1.x constraint still
  # advertised by native_prebuilt 0.4.0.
  code_assets: ">=1.2.1 <3.0.0"
  contextual: ^2.2.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_prebuilt: ^0.4.0
  json_annotation: ^4.10.0

dev_dependencies:
  # ffigen 21's hook currently fails against code_assets 2; keep the latest
  # generator release that works with the workspace asset protocol.
  ffigen: ^20.1.1
  path: ^1.9.1
  relic: ^1.2.0
  routed_core: ">=0.4.0 <1.0.0"
  routed_logging: ">=0.2.0 <1.0.0"
  routed_io: ">=0.1.0 <1.0.0"
  shelf: ^1.4.2
  test: ^1.29.0
  very_good_analysis: ^10.0.0
