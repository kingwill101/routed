name: routed_openapi
description: OpenAPI extraction and generation for Routed - portable OpenAPI spec generation from route manifests.
version: 0.1.0
repository: https://github.com/kingwill101/routed

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  routed_core: ">=0.4.0 <1.0.0"
  routed_validation: ">=0.1.0 <1.0.0"
  server_auth: ">=0.1.0 <1.0.0"
  analyzer: ^10.0.1
  build: ^4.0.0
  collection: ^1.19.1
  glob: ^2.1.3
  meta: ^1.18.0
  path: ^1.9.1

  json_schema_builder: ^0.1.6
dev_dependencies:
  routed_testing: ">=0.4.0 <1.0.0"
  server_testing: ">=0.4.0 <1.0.0"
  lints: ^6.0.0
  test: ^1.29.0
