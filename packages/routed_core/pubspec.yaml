  event_bus: ^2.0.1
  file: ^7.0.1
  fuzzywuzzy: ^1.2.0
  http: ^1.6.0
  http2: ^2.3.1
  http_parser: ^4.1.2
  liquify: ^1.6.1
  meta: ^1.18.0
  path: ^1.9.1
  server_contracts: ">=0.1.0 <1.0.0"
  stack_trace: ^1.12.1
  stream_transform: ^2.1.1
dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  property_testing: ^0.3.2
  routed_testing: ">=0.4.0 <1.0.0"
  server_testing: ">=0.4.0 <1.0.0"
  test: ^1.29.0
  very_good_analysis: ^10.0.0
