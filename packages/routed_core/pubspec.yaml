name: routed_core
description: Slim HTTP engine core for the Routed ecosystem (Engine, Context, Router). Feature packages live under routed_* / server_*.
version: 0.5.0
repository: https://github.com/kingwill101/routed/tree/master/packages/routed_core
tags:
  - routing
  - server
  - http

funding:
  - https://www.buymeacoffee.com/kingwill101

resolution: workspace


environment:
  sdk: ">=3.9.0 <4.0.0"

executables:
  routed: routed

# Add regular dependencies here.
dependencies:
  collection: ^1.19.1
