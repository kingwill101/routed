  event_bus: ^2.0.1
  fuzzywuzzy: ^1.2.0
  http: ^1.6.0
  http2: ^2.3.1
  http_parser: ^4.1.2
  json2yaml: ^3.0.1
  json_schema_builder: ^0.1.3
  liquify: ^1.6.1
  meta: ^1.18.0
  path: ^1.9.1
  stack_trace: ^1.12.1
  stream_transform: ^2.1.1
  yaml: ^3.1.3
dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  property_testing: ^0.3.2
  routed_testing: ^0.3.3
  server_testing: ^0.3.2
  test: ^1.29.0