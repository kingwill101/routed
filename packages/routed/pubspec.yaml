name: routed
description: A modular HTTP engine and routing framework for Dart with middleware, configuration, sessions, and observability built in.
version: 0.3.3
repository: https://github.com/kingwill101/routed/tree/master/packages/routed
tags:
  - routing
  - server
  - http

funding:
  - https://www.buymeacoffee.com/kingwill101

resolution: workspace


environment:
  sdk: ">=3.9.0 <4.0.0"

executables:
  routed: routed

# Add regular dependencies here.
dependencies:
  server_sessions: ^0.1.0
  args: ^2.7.0
  artisanal: ^0.3.0
  collection: ^1.19.1
  contextual: ^2.2.0
  dartastic_opentelemetry: ^0.9.3
  dartastic_opentelemetry_api: ^0.8.7
  dotenv: ^4.2.0
  es_compression: ^2.0.15
  event_bus: ^2.0.1
  fuzzywuzzy: ^1.2.0
  glob: ^2.1.3
  http: ^1.6.0
  http2: ^2.3.1
  http_parser: ^4.1.2
  jose: ^0.3.5+2
  json2yaml: ^3.0.1
  json_schema_builder: ^0.1.3
  meta: ^1.18.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  sentry: ^9.10.0
  stack_trace: ^1.12.1
  storage_fs: ^0.1.0
  stream_transform: ^2.1.1
  watcher: ^1.2.1
dev_dependencies:
  server_sessions: ^0.1.0
  coverage: ^1.15.0
  lints: ^6.0.0
  property_testing: ^0.3.2
