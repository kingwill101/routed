name: routed
description: A modular HTTP engine and routing framework for Dart with middleware, configuration, sessions, and observability built in.
version: 0.3.3
repository: https://github.com/kingwill101/routed/tree/master/packages/routed
tags:
  - routing
  - server
  - http

funding:
  - https://www.buymeacoffee.com/kingwill101

resolution: workspace


environment:
  sdk: ">=3.9.0 <4.0.0"

executables:
  routed: routed

# Add regular dependencies here.
dependencies:
  collection: ^1.19.1
