include: package:lints/recommended.yaml

analyzer:
  exclude:
    - templates/scaffold/**
    - test/console/**
    - test/view/**
    - test/translation/**
    - test/provider/storage_provider_test.dart
    - test/provider/localization_provider_test.dart
    - test/session_store_test.dart
    - test/session_driver_registry_test.dart
    - test/binding_test.dart
    - test/multipart_test.dart
    - test/context/sse_test.dart
    - test/cache/**
    - test/middleware/localization_middleware_test.dart
    - test/auth/**
    - test/provider/**
    - test/middleware/**
    - test/render/**
    - test/session_test.dart
    - test/validation_rules_test.dart
    - test/template_engine_test.dart
    - test/support/translation_helpers_test.dart
    - test/engine/upload_guardrails_test.dart
    - test/context/flash_messages_test.dart
    - test/container/container_test.dart
    - test/router_case2_test.dart
    - test/engine/**
    - test/static_files_test.dart
    - example/custom_drivers.dart
  errors:
    depend_on_referenced_packages: ignore
    invalid_use_of_visible_for_testing_member: ignore
    strict_top_level_inference: ignore
    inference_failure_on_uninitialized_variable: ignore
    prefer_typing_uninitialized_variables: ignore
    avoid_renaming_method_parameters: ignore
    implementation_imports: ignore
    unused_import: ignore
    unused_local_variable: ignore
    unused_element: ignore
    sort_pub_dependencies: ignore
    undefined_shown_name: ignore
    invalid_annotation_target: ignore
    override_on_non_overriding_member: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_shadowing_type_parameters
    - avoid_types_as_parameter_names
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions
    - close_sinks
    - empty_catches
    - hash_and_equals
    - implementation_imports
    - non_constant_identifier_names
    - package_names
    - package_prefixed_library_names
    - prefer_const_constructors
    - prefer_is_empty
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
