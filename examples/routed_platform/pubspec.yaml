name: routed_platform
description: Routed CLI reference platform with an in-memory Stem worker.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  args: ^2.7.0
  routed_core:
    path: ../../packages/routed_core
  routed_http: ^0.1.2
  routed_io:
    path: ../../packages/routed_io
  stem: ^0.2.1

dev_dependencies:
  lints: ^6.0.0
  routed_cli: ^0.3.0
  routed_testing:
    path: ../../packages/server_testing/routed_testing
  server_testing: ^0.4.0
  test: ^1.29.0

dependency_overrides:
  artisanal: ^0.5.0
  routed_core:
    path: ../../packages/routed_core
